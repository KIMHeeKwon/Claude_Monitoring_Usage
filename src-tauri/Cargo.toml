[package]
name = "claude-monitoring-usage"
version = "0.0.1"
description = "Claude subscription limits + CPU/MEM/GPU always-on-top window"
authors = ["KIMHeeKwon"]
edition = "2021"

[lib]
name = "claude_monitoring_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.39"
chrono = "0.4"
ureq = "3"

# GPU: NVIDIA 관리 라이브러리는 드라이버가 깔아 두는 DLL을 실행 중에 찾아 연다.
# 없는 PC에서도 앱은 그대로 돌고 GPU 행만 숨는다. macOS에는 NVIDIA가 없으므로 뺀다.
[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.11"

# GPU 사용률을 작업 관리자와 같은 방식(성능 카운터)으로 읽는다. 제조사를 가리지 않는다.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Performance", "Win32_Foundation"] }
