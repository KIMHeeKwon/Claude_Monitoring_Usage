[package]
name = "claude-monitoring-usage"
version = "0.0.1"
description = "Claude subscription limits + CPU/MEM/GPU always-on-top window"
authors = ["KIMHeeKwon"]
edition = "2021"

[lib]
name = "claude_monitoring_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.39"
chrono = "0.4"
